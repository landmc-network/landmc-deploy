# Serves the network's resource pack and the manifest that describes it.
#
# Two different readers, and that is the whole shape of this: the manifest is read by the proxy
# from inside the stack, and the pack itself is downloaded by every player's client from
# outside it. So the port is published, unlike every other service here - a pack nobody can
# reach is a pack nobody can join with.
#
# Static files and nothing else. No upload, no scripting, no directory listing: the only thing
# reachable is the zip whose name is already in the manifest.

server {
    listen 8082;
    server_name _;

    root /srv/resourcepack;
    autoindex off;
    server_tokens off;

    # A pack is a few megabytes and every client asks for it once. Sendfile is the difference
    # between that being free and being a copy through userspace per player.
    sendfile on;
    tcp_nopush on;

    # Only reading, and only the two things that exist.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /manifest.json {
        # Read by the proxy on start and after a rebuild; never worth a cached copy.
        add_header Cache-Control "no-store" always;
        default_type application/json;
    }

    # Quoted: nginx reads a bare { as the start of a block, so the repetition count in an
    # unquoted regex ends the directive halfway through it.
    location ~ "^/landmc-[0-9a-f]{40}\.zip$" {
        # The name contains the hash, so a given URL is one exact file forever. Caching it for
        # a year is safe, and the next pack is a different URL rather than a stale one.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        default_type application/zip;
    }

    location / {
        return 404;
    }
}
