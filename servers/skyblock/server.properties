# Paper 26.2, behind the proxy. The SkyBlock backend.
#
# online-mode is false because the proxy authenticates and forwards the player's real profile.
# That is only safe because the backend is not reachable from outside the compose network -
# with modern forwarding on and the secret set, a direct connection is rejected anyway.
online-mode=false
server-ip=0.0.0.0
server-port=25565
motd=LandMC SkyBlock
max-players=500
view-distance=6
simulation-distance=4
spawn-protection=0
enable-command-block=false
allow-flight=true
enforce-secure-profile=false
level-name=skyblock
# An empty world, through vanilla rather than a plugin: SkyBlock islands are built into a void,
# and nothing here generates them yet. A flat world with no layers is exactly that, and it costs
# no plugin - the lobby needs its own generator only because its world is selected in bukkit.yml.
level-type=minecraft\:flat
generator-settings={"layers":[],"biome":"minecraft:the_void"}
generate-structures=false
spawn-monsters=true
spawn-animals=true
spawn-npcs=false
difficulty=normal
gamemode=survival
force-gamemode=false
pvp=true
enable-status=false
network-compression-threshold=-1
sync-chunk-writes=false
